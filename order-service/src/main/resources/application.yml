spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orders_db}
    username: ${SPRING_DATASOURCE_USERNAME:provisioning}
    password: ${SPRING_DATASOURCE_PASSWORD:provisioning}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  structured:
    format:
      console: ${LOGGING_FORMAT:}

saga:
  mechanism: ${SAGA_MECHANISM:naive}
  step-timeout-ms: ${SAGA_STEP_TIMEOUT_MS:3000}
  retry:
    max-attempts: ${SAGA_RETRY_MAX_ATTEMPTS:3}
    backoff-ms: ${SAGA_RETRY_BACKOFF_MS:50}

clients:
  inventory-base-url: ${CLIENTS_INVENTORY_BASE_URL:http://localhost:8081}
  provisioning-base-url: ${CLIENTS_PROVISIONING_BASE_URL:http://localhost:8082}
