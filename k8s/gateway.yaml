apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: provisioning-saga-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: LOGGING_FORMAT
              value: logstash
            - name: CLIENTS_ORDER_BASE_URL
              value: http://order-service:8083
            - name: CLIENTS_INVENTORY_BASE_URL
              value: http://inventory-service:8081
            - name: CLIENTS_PROVISIONING_BASE_URL
              value: http://provisioning-service:8082
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 3
            failureThreshold: 30
          resources:
            requests:
              cpu: 200m
              memory: 320Mi
            limits:
              cpu: 500m
              memory: 640Mi
