apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service
  ports:
    - port: 8083
      targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: provisioning-saga-order-service:latest
          # The images are built locally and loaded into the cluster with
          # "kind load docker-image"; there is no registry to pull them from.
          imagePullPolicy: Never
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/orders_db
            - name: SPRING_DATASOURCE_USERNAME
              value: provisioning
            - name: SPRING_DATASOURCE_PASSWORD
              value: provisioning
            - name: LOGGING_FORMAT
              value: logstash
            - name: SAGA_MECHANISM
              value: saga
            - name: CLIENTS_INVENTORY_BASE_URL
              value: http://inventory-service:8081
            - name: CLIENTS_PROVISIONING_BASE_URL
              value: http://provisioning-service:8082
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            # An HPA cannot compute a utilisation ratio without a CPU request,
            # so this is required rather than good practice.
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
