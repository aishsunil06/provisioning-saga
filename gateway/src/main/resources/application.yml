spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: activations
              uri: ${CLIENTS_ORDER_BASE_URL:http://localhost:8083}
              predicates:
                - Path=/api/activations/**
              filters:
                - StripPrefix=1
            - id: reservations
              uri: ${CLIENTS_INVENTORY_BASE_URL:http://localhost:8081}
              predicates:
                - Path=/api/reservations/**
              filters:
                - StripPrefix=1
            - id: provisions
              uri: ${CLIENTS_PROVISIONING_BASE_URL:http://localhost:8082}
              predicates:
                - Path=/api/provisions/**
              filters:
                - StripPrefix=1

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  structured:
    format:
      console: ${LOGGING_FORMAT:}
